<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Bibliotheque</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light p-4">

  <h1 id="titre">Ma bibliotheque:</h1>

  <div class="fonctions">

      <option value="Science">Science</option>

    </select>
    
    <span id="nbLivres" >0 livres</span>

  <div id="zonePrincipale" class="container"></div>

  <script src="app.js"></script>
</body>
</html>
