<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliotheque</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">

  <header class="top-header">
    <h1 id="titre">Ma bibliotheque-vesion a:</h1>
    <div class="header-icons">
      <span></span><span></span><span class="profile"></span>
    </div>
  </header>

  <p class="sous-titre">Choisis ton prochain livre préféré</p>

  <div class="fonctions">
   <div class="search-wrapper">
     <span class="icon-search"></span>
     <input type="text" id="searchInput" placeholder="Rechercher un livre ou auteur...">
   </div>
    <select id="filtreCategorie">
      <option value="tous">Toutes les categories</option>
      <option value="Classique">Classique</option>
      <option value="Roman">Roman</option>
      <option value="Science">Science</option>
      <option value="Histoire">Histoire</option>
    </select>
    <span id="nbLivres">0 livres</span>
  </div>

  <div id="zonePrincipale" class="container"></div>
  <script src="app.js"></script>
</body>
</html>
